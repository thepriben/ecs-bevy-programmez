<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 660" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <g id="tick">
      <path d="M-5 0 L-1.6 3.6 L5 -4.2" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <marker id="arrowNavy" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1f3a6e"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#e08a2e"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#3a9d5d"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2f6fd0"/>
    </marker>
  </defs>

  <rect width="1024" height="660" fill="#ffffff"/>

  <text x="24" y="32" font-size="18" fill="#1f2630">On peut se repr&#233;senter un ECS comme une base de donn&#233;es :</text>

  <!-- Annotation: Entites -->
  <g>
    <rect x="20" y="150" width="156" height="84" rx="10" fill="#fdf3e6" stroke="#e8c89b"/>
    <text x="34" y="176" font-size="13" font-weight="700" fill="#b9711f">Entit&#233;s</text>
    <text x="34" y="197" font-size="11" fill="#6b5742">Identifiants uniques</text>
    <text x="34" y="212" font-size="11" fill="#6b5742">sans donn&#233;es ni</text>
    <text x="34" y="227" font-size="11" fill="#6b5742">comportement.</text>
    <line x1="178" y1="192" x2="202" y2="192" stroke="#e08a2e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowOrange)"/>
  </g>

  <!-- Annotation: Composants -->
  <g>
    <rect x="850" y="150" width="158" height="92" rx="10" fill="#e9f6ee" stroke="#a9d8bc"/>
    <text x="864" y="176" font-size="13" font-weight="700" fill="#2f7d4f">Composants</text>
    <text x="864" y="197" font-size="11" fill="#3f6450">Donn&#233;es simples</text>
    <text x="864" y="212" font-size="11" fill="#3f6450">(positions, vitesses,</text>
    <text x="864" y="227" font-size="11" fill="#3f6450">param&#232;tres&#8230;).</text>
    <line x1="848" y1="196" x2="824" y2="196" stroke="#3a9d5d" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- ECS World panel -->
  <rect x="196" y="58" width="632" height="248" rx="12" fill="#ffffff" stroke="#cdd7e8" stroke-width="1.5"/>
  <rect x="196" y="58" width="632" height="36" rx="12" fill="#eef3fb"/>
  <text x="512" y="82" text-anchor="middle" font-size="15" fill="#5b6470"><tspan font-size="16" font-weight="700" fill="#1f3a6e">ECS World </tspan>(le monde contient toutes les entit&#233;s et leurs composants)</text>

  <!-- table header tints -->
  <g>
    <rect x="302" y="104" width="76" height="28" fill="#eaf1fc"/>
    <rect x="378" y="104" width="76" height="28" fill="#e9f6ee"/>
    <rect x="454" y="104" width="76" height="28" fill="#fdf1e3"/>
    <rect x="530" y="104" width="76" height="28" fill="#efe9fb"/>
    <rect x="606" y="104" width="76" height="28" fill="#fbe9e9"/>
    <rect x="682" y="104" width="76" height="28" fill="#e2f4f4"/>
  </g>
  <!-- header labels -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="254" y="122" fill="#1f2630">Entit&#233; (ID)</text>
    <text x="340" y="122" fill="#2f6fd0">Transform</text>
    <text x="416" y="122" fill="#3a9d5d">Orbit</text>
    <text x="492" y="122" fill="#e08a2e">Spin</text>
    <text x="568" y="122" fill="#7a52c8">Bob</text>
    <text x="644" y="122" fill="#d9534f">LightPulse</text>
    <text x="720" y="122" fill="#2aa3a3">CameraRig</text>
    <text x="788" y="122" fill="#9aa3b0">&#8230;</text>
  </g>
  <!-- column separators -->
  <g stroke="#eef1f6" stroke-width="1">
    <line x1="302" y1="104" x2="302" y2="300"/>
    <line x1="378" y1="104" x2="378" y2="300"/>
    <line x1="454" y1="104" x2="454" y2="300"/>
    <line x1="530" y1="104" x2="530" y2="300"/>
    <line x1="606" y1="104" x2="606" y2="300"/>
    <line x1="682" y1="104" x2="682" y2="300"/>
    <line x1="758" y1="104" x2="758" y2="300"/>
  </g>
  <!-- row separators -->
  <g stroke="#eef1f6" stroke-width="1">
    <line x1="206" y1="132" x2="818" y2="132"/>
    <line x1="206" y1="170" x2="818" y2="170"/>
    <line x1="206" y1="204" x2="818" y2="204"/>
    <line x1="206" y1="238" x2="818" y2="238"/>
    <line x1="206" y1="272" x2="818" y2="272"/>
  </g>
  <!-- row id labels -->
  <g font-size="12" fill="#39404a" text-anchor="middle">
    <text x="254" y="157">1</text>
    <text x="254" y="191">2</text>
    <text x="254" y="225">3</text>
    <text x="254" y="259">4</text>
    <text x="254" y="290" fill="#9aa3b0">&#8230;</text>
  </g>

  <!-- checkmarks -->
  <!-- row1 -->
  <circle cx="340" cy="153" r="11" fill="#2f6fd0"/><use href="#tick" x="340" y="153"/>
  <circle cx="416" cy="153" r="11" fill="#3a9d5d"/><use href="#tick" x="416" y="153"/>
  <circle cx="492" cy="153" r="11" fill="#e08a2e"/><use href="#tick" x="492" y="153"/>
  <!-- row2 -->
  <circle cx="340" cy="187" r="11" fill="#2f6fd0"/><use href="#tick" x="340" y="187"/>
  <circle cx="720" cy="187" r="11" fill="#2aa3a3"/><use href="#tick" x="720" y="187"/>
  <!-- row3 -->
  <circle cx="340" cy="221" r="11" fill="#2f6fd0"/><use href="#tick" x="340" y="221"/>
  <circle cx="568" cy="221" r="11" fill="#7a52c8"/><use href="#tick" x="568" y="221"/>
  <circle cx="644" cy="221" r="11" fill="#d9534f"/><use href="#tick" x="644" y="221"/>
  <!-- row4 -->
  <circle cx="340" cy="255" r="11" fill="#2f6fd0"/><use href="#tick" x="340" y="255"/>
  <circle cx="416" cy="255" r="11" fill="#3a9d5d"/><use href="#tick" x="416" y="255"/>

  <!-- manifold to systems -->
  <line x1="512" y1="306" x2="512" y2="330" stroke="#1f3a6e" stroke-width="2"/>
  <line x1="265" y1="330" x2="787" y2="330" stroke="#1f3a6e" stroke-width="2"/>
  <rect x="424" y="315" width="176" height="20" fill="#ffffff"/>
  <text x="512" y="329" text-anchor="middle" font-size="13" font-weight="700" fill="#1f3a6e"><tspan>Systems </tspan><tspan font-weight="400" fill="#5b6470">(traitements)</tspan></text>
  <g stroke="#1f3a6e" stroke-width="2">
    <line x1="265" y1="330" x2="265" y2="366" marker-end="url(#arrowNavy)"/>
    <line x1="439" y1="330" x2="439" y2="366" marker-end="url(#arrowNavy)"/>
    <line x1="613" y1="330" x2="613" y2="366" marker-end="url(#arrowNavy)"/>
    <line x1="787" y1="330" x2="787" y2="366" marker-end="url(#arrowNavy)"/>
  </g>

  <!-- Annotation: Systemes -->
  <g>
    <rect x="20" y="392" width="156" height="104" rx="10" fill="#eaf1fc" stroke="#b6cdee"/>
    <text x="34" y="418" font-size="13" font-weight="700" fill="#2f6fd0">Syst&#232;mes</text>
    <text x="34" y="439" font-size="11" fill="#46546b">Parcourent uniquement</text>
    <text x="34" y="454" font-size="11" fill="#46546b">les entit&#233;s qui poss&#232;dent</text>
    <text x="34" y="469" font-size="11" fill="#46546b">les composants demand&#233;s</text>
    <text x="34" y="484" font-size="11" fill="#46546b">(requ&#234;tes).</text>
    <line x1="178" y1="430" x2="202" y2="430" stroke="#2f6fd0" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- System cards -->
  <!-- Orbit -->
  <g>
    <rect x="190" y="372" width="150" height="116" rx="12" fill="#eef8f1" stroke="#bfe2cd"/>
    <g transform="translate(265,408)" fill="none" stroke="#3a9d5d" stroke-width="2.4">
      <path d="M-13 2 A14 14 0 1 1 -8 11" stroke-linecap="round"/>
      <path d="M-8 4 L-13 2 L-12 8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="265" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7d4f">Orbit System</text>
    <text x="265" y="466" text-anchor="middle" font-size="10.5" fill="#4d5a4f">Met &#224; jour la position</text>
    <text x="265" y="480" text-anchor="middle" font-size="10.5" fill="#4d5a4f">des entit&#233;s qui orbitent.</text>
  </g>
  <!-- Spin -->
  <g>
    <rect x="364" y="372" width="150" height="116" rx="12" fill="#fdf4e8" stroke="#f0d6ad"/>
    <g transform="translate(439,408)" fill="none" stroke="#e08a2e" stroke-width="2.4">
      <path d="M11 -6 A13 13 0 1 0 13 4" stroke-linecap="round"/>
      <path d="M7 -7 L12 -7 L12 -2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="439" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#bf7a1f">Spin System</text>
    <text x="439" y="466" text-anchor="middle" font-size="10.5" fill="#5d513f">Fait tourner les entit&#233;s</text>
    <text x="439" y="480" text-anchor="middle" font-size="10.5" fill="#5d513f">sur elles-m&#234;mes.</text>
  </g>
  <!-- Bob -->
  <g>
    <rect x="538" y="372" width="150" height="116" rx="12" fill="#eef0fb" stroke="#c7cdf0"/>
    <path d="M585 408 q7 -12 14 0 q7 12 14 0" fill="none" stroke="#5a63c8" stroke-width="2.6" stroke-linecap="round"/>
    <text x="613" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#4a52b8">Bob System</text>
    <text x="613" y="466" text-anchor="middle" font-size="10.5" fill="#4f5266">Fait osciller les entit&#233;s</text>
    <text x="613" y="480" text-anchor="middle" font-size="10.5" fill="#4f5266">verticalement.</text>
  </g>
  <!-- LightPulse -->
  <g>
    <rect x="712" y="372" width="150" height="116" rx="12" fill="#fdeeee" stroke="#f2c4c2"/>
    <g transform="translate(787,408)" stroke="#d9534f" stroke-width="2.2" stroke-linecap="round">
      <circle r="6.5" fill="none"/>
      <line x1="0" y1="-13" x2="0" y2="-9.5"/><line x1="0" y1="9.5" x2="0" y2="13"/>
      <line x1="-13" y1="0" x2="-9.5" y2="0"/><line x1="9.5" y1="0" x2="13" y2="0"/>
      <line x1="-9" y1="-9" x2="-6.7" y2="-6.7"/><line x1="6.7" y1="6.7" x2="9" y2="9"/>
      <line x1="9" y1="-9" x2="6.7" y2="-6.7"/><line x1="-6.7" y1="6.7" x2="-9" y2="9"/>
    </g>
    <text x="787" y="446" text-anchor="middle" font-size="13" font-weight="700" fill="#c0403c">LightPulse System</text>
    <text x="787" y="466" text-anchor="middle" font-size="10.5" fill="#6b4f4e">Fait pulser l'intensit&#233;</text>
    <text x="787" y="480" text-anchor="middle" font-size="10.5" fill="#6b4f4e">des lumi&#232;res.</text>
  </g>

  <!-- Requete pills -->
  <g font-size="11" text-anchor="middle">
    <rect x="194" y="500" width="142" height="42" rx="8" fill="#eef8f1" stroke="#bfe2cd"/>
    <text x="265" y="517" fill="#2f7d4f" font-weight="700">Requ&#234;te :</text>
    <text x="265" y="533" fill="#2f7d4f">Orbit + Transform</text>

    <rect x="368" y="500" width="142" height="42" rx="8" fill="#fdf4e8" stroke="#f0d6ad"/>
    <text x="439" y="517" fill="#bf7a1f" font-weight="700">Requ&#234;te :</text>
    <text x="439" y="533" fill="#bf7a1f">Spin + Transform</text>

    <rect x="542" y="500" width="142" height="42" rx="8" fill="#eef0fb" stroke="#c7cdf0"/>
    <text x="613" y="517" fill="#4a52b8" font-weight="700">Requ&#234;te :</text>
    <text x="613" y="533" fill="#4a52b8">Bob + Transform</text>

    <rect x="716" y="500" width="142" height="42" rx="8" fill="#fdeeee" stroke="#f2c4c2"/>
    <text x="787" y="517" fill="#c0403c" font-weight="700">Requ&#234;te :</text>
    <text x="787" y="533" fill="#c0403c">LightPulse + Light</text>
  </g>

  <!-- bottom engine bar -->
  <rect x="190" y="568" width="672" height="44" rx="10" fill="#eef3fb" stroke="#c9d6ec"/>
  <g transform="translate(218,590)" fill="none" stroke="#2f6fd0" stroke-width="1.8">
    <circle r="5"/>
    <circle r="9" stroke-dasharray="2.2 3.4"/>
  </g>
  <text x="246" y="594" font-size="12.5" fill="#34415c">Le moteur ECS ex&#233;cute les syst&#232;mes, en parall&#232;le quand c'est possible, selon les d&#233;pendances.</text>
</svg>
